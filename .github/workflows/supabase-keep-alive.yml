# Keeps the Supabase free-tier project awake.
#
# Supabase pauses free projects after ~1 week of insufficient activity and only
# a human clicking Resume brings them back. This must run outside Supabase —
# pg_cron would pause along with the database.
#
# Every 6 hours rather than daily: Supabase's threshold is documented only as
# "a few user requests to the database each day", so once a day is cutting it
# fine. GitHub Actions cron is free on public and private repos.
#
# Three GitHub Actions rules this depends on:
#   1. Scheduled workflows run ONLY on the default branch, so this file has to
#      be merged to `main` to fire at all.
#   2. This repo IS public, and GitHub disables scheduled workflows in public
#      repos automatically after 60 days with no repository activity. GitHub
#      emails first, and a push or a manual run resets the clock. Because that
#      would silently stop the keep-alive, `vercel.json` also runs a daily
#      Vercel Cron against the same endpoint — Vercel's scheduler does not
#      depend on repo activity, so it keeps working even if this one is
#      disabled. Belt and braces; the Resend fallback in saveLead is the
#      actual guarantee that no lead is lost.
#   3. Runs scheduled on the hour can be delayed or dropped under load, so this
#      deliberately fires at :17 rather than :00.
#
# The URL is hardcoded below on purpose. It is a public endpoint, so it gains
# nothing from being a secret, and a secret with a stray quote or a trailing
# newline fails as an unreadable "malformed URL" because GitHub masks the value
# in the logs. If the domain ever changes, edit KEEP_ALIVE_URL here.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   CRON_SECRET - REQUIRED. Same value as the CRON_SECRET env var in Vercel.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      KEEP_ALIVE_URL: https://www.dr-webstudio.com/api/keep-alive
    steps:
      - name: Ping keep-alive endpoint
        env:
          # Passed through env rather than interpolated into the script, so an
          # odd value cannot mangle the command line.
          CRON_SECRET_RAW: ${{ secrets.CRON_SECRET }}
        run: |
          # Pasting into GitHub's secret box readily picks up a trailing
          # newline, which would silently corrupt the Authorization header.
          CRON_SECRET=$(printf '%s' "$CRON_SECRET_RAW" | tr -d '[:space:]')

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is empty or not set."
            echo "  Add it under Settings -> Secrets and variables -> Actions,"
            echo "  on the *Secrets* tab (not Variables), named exactly"
            echo "  CRON_SECRET, matching the value set in Vercel."
            exit 1
          fi
          echo "CRON_SECRET present (${#CRON_SECRET} chars after trimming)."
          echo "Pinging $KEEP_ALIVE_URL"

          set +e
          code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$KEEP_ALIVE_URL")
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::curl failed (exit $curl_exit) before getting a response."
            case "$curl_exit" in
              3) echo "  Exit 3 = malformed URL. KEEP_ALIVE_URL above is wrong." ;;
              6) echo "  Exit 6 = could not resolve host." ;;
              28) echo "  Exit 28 = timed out after 30s." ;;
            esac
            exit 1
          fi

          echo "HTTP $code"
          cat /tmp/body || true
          echo

          case "$code" in
            200) echo "Keep-alive OK." ;;
            401) echo "::error::401 - CRON_SECRET here does not match Vercel's, or Vercel was not redeployed after the env var was added."; exit 1 ;;
            404) echo "::error::404 - the route is not deployed at that path."; exit 1 ;;
            503) echo "::error::503 - Supabase env vars are not set in Vercel yet."; exit 1 ;;
            *)   echo "::error::Keep-alive failed with HTTP $code"; exit 1 ;;
          esac
